---
schemaVersion: 1
module: "homeassistant"
target: "apps"
services:
  homeassistant:
    image: "ghcr.io/home-assistant/home-assistant:2026.1.0"
    containerName: "homeassistant"
    lifecycle: "daemon"
    updatePolicy: "registry"
    placement: "rootful"
    dependencies:
      caddy: "started"
      postgres: "healthy"
    environment:
      TZ: "UTC"
      PUID: "${CONTAINER_USER_ID:-1000}"
      PGID: "${CONTAINER_GROUP_ID:-1000}"
      HOMEASSISTANT_DB_URL: "postgresql://homeassistant:${POSTGRES_HOMEASSISTANT_PASSWORD}@postgres:5432/homeassistant"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: 5432
      POSTGRES_DB: "homeassistant"
      POSTGRES_USER: "homeassistant"
      TRUSTED_PROXY_NETWORKS: "172.16.0.0/12"
      HOMEASSISTANT_TRUSTED_PROXY_SECRET: "${HOMEASSISTANT_TRUSTED_PROXY_SECRET}"
      STACK_ADMIN_USER: "${STACK_ADMIN_USER}"
      STACK_ADMIN_PASSWORD: "${STACK_ADMIN_PASSWORD}"
      STACK_ADMIN_EMAIL: "${STACK_ADMIN_EMAIL}"
    networks:
      caddy: null
      postgres: null
      internet: null
    volumes:
    - "homeassistant_data:/config"
    - "/etc/localtime:/etc/localtime:ro"
    - "./configs/homeassistant/configuration.yaml:/config/configuration.yaml:ro"
    - "./configs/homeassistant/automations.yaml:/config/automations.yaml:rw"
    - "./configs/homeassistant/scripts.yaml:/config/scripts.yaml:rw"
    - "./configs/homeassistant/scenes.yaml:/config/scenes.yaml:rw"
    - "./configs/homeassistant/init-homeassistant.sh:/init-homeassistant.sh:ro"
    - "./configs/homeassistant/entrypoint.sh:/entrypoint-wrapper.sh:ro"
    - "./configs/homeassistant/auth_keycloak.py:/usr/src/homeassistant/homeassistant/auth/providers/trusted_networks.py:ro"
    health:
      test:
      - "CMD-SHELL"
      - "curl -f http://localhost:8123/manifest.json || exit 1"
      interval: "60s"
      timeout: "10s"
      retries: 3
      start_period: "120s"
    entrypoint:
    - "/entrypoint-wrapper.sh"
    restart: "unless-stopped"
networks: {}
volumes: {}
